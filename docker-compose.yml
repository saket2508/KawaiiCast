services:
  postgres:
    image: postgres:14
    container_name: "${DB_CONTAINER_NAME}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-v2/database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-v2:
    build:
      context: ./backend-v2
      dockerfile: Dockerfile
    environment:
      PORT: ${BACKEND_PORT}
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}
        NEXT_PUBLIC_TORRENT_API_URL: http://localhost:${BACKEND_PORT}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}
      NEXT_PUBLIC_TORRENT_API_URL: http://localhost:${BACKEND_PORT}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend-v2
    restart: unless-stopped

volumes:
  postgres_data:
