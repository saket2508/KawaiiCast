services:
  postgres:
    image: postgres:14
    container_name: "${DB_CONTAINER_NAME}"
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database.sql:/docker-entrypoint-initdb.d/database.sql
    env_file:
      - path: ./backend/.env
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - path: ./frontend/.env.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/next
      - /app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
